<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرئيسية - منظومة استوديو ارتياتك</title>
    <link rel="stylesheet" href="css/shared.css">
    <style>
        /* إضافات تصميمية مخصصة للرئيسية */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--glass-shadow);
            backdrop-filter: blur(10px);
        }
        .stat-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 600;
        }
        .stat-value {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(45deg, var(--text-main), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-icon {
            font-size: 32px;
            opacity: 0.8;
        }

        .dashboard-body-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }

        @media (max-width: 900px) {
            .dashboard-body-grid {
                grid-template-columns: 1fr;
            }
        }

        /* سجل العمليات */
        .log-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 450px;
            overflow-y: auto;
            padding-left: 5px;
        }
        .log-item {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        .log-actor {
            font-weight: 700;
            color: var(--accent-cyan);
        }
        .log-action {
            margin-right: 5px;
            color: var(--text-main);
        }
        .log-time {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* إدارة المستخدمين */
        .admin-section {
            display: none; /* يتم إظهارها للأدمن فقط بواسطة JS */
        }
        .user-list-card {
            max-height: 350px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <main class="main-content" id="main-content-area">
            
            <!-- شبكة الإحصائيات (Stats Cards) -->
            <div class="stats-grid">
                
                <div class="stat-card">
                    <div class="stat-info">
                        <span class="stat-label">رصيدي الشخصي</span>
                        <span class="stat-value" id="stat-my-balance">0.00 د.إ</span>
                    </div>
                    <div class="stat-icon">💳</div>
                </div>

                <div class="stat-card">
                    <div class="stat-info">
                        <span class="stat-label">الصندوق التشغيلي</span>
                        <span class="stat-value" id="stat-opex-fund">0.00 د.إ</span>
                    </div>
                    <div class="stat-icon">🔧</div>
                </div>

                <div class="stat-card">
                    <div class="stat-info">
                        <span class="stat-label">محفظة التكافل والمساهمة</span>
                        <span class="stat-value" id="stat-solidarity-pool">0.00 د.إ</span>
                    </div>
                    <div class="stat-icon">🤝</div>
                </div>

                <div class="stat-card">
                    <div class="stat-info">
                        <span class="stat-label">المشاريع النشطة</span>
                        <span class="stat-value" id="stat-active-projects">0</span>
                    </div>
                    <div class="stat-icon">🚀</div>
                </div>

            </div>

            <!-- محتوى لوحة التحكم الرئيسي -->
            <div class="dashboard-body-grid">
                
                <!-- قسم سجل العمليات العام -->
                <div class="glass-card">
                    <h2 style="font-size: 18px; margin-bottom: 20px; font-weight: 700; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">📋 سجل العمليات والأحداث الأخير</h2>
                    <div class="log-list" id="activity-logs-container">
                        <div class="noti-empty">تحميل الأحداث والعمليات...</div>
                    </div>
                </div>

                <!-- قسم إدارة المستخدمين (يظهر للأدمن فقط) -->
                <div class="glass-card admin-section" id="admin-user-card">
                    <h2 style="font-size: 18px; margin-bottom: 20px; font-weight: 700; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">👥 إضافة عضو جديد للاستوديو</h2>
                    
                    <form id="create-user-form" onsubmit="return false;">
                        <div class="form-group">
                            <label class="form-label" for="new-user-name">اسم العضو الثنائي</label>
                            <input type="text" id="new-user-name" class="form-control" required placeholder="مثال: براء الفارس">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="new-user-email">البريد الإلكتروني</label>
                            <input type="email" id="new-user-email" class="form-control" required placeholder="username@gmail.com">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="new-user-password">كلمة المرور الافتراضية</label>
                            <input type="text" id="new-user-password" class="form-control" required placeholder="أدخل كلمة مرور قوية">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="new-user-role">الدور التشغيلي</label>
                            <select id="new-user-role" class="form-control">
                                <option value="member">عضو استوديو عادي</option>
                                <option value="admin">مدير مع صلاحيات كاملة (Admin)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;" id="create-user-btn">إضافة الحساب واعتماده</button>
                    </form>

                    <h2 style="font-size: 16px; margin-top: 30px; margin-bottom: 15px; font-weight: 700;">أعضاء الاستوديو المسجلين</h2>
                    <div class="user-list-card">
                        <table class="custom-table" id="registered-users-table">
                            <thead>
                                <tr>
                                    <th>الاسم</th>
                                    <th>الدور</th>
                                    <th>الحالة</th>
                                </tr>
                            </thead>
                            <tbody id="registered-users-body">
                                <tr><td colspan="3" style="text-align:center;">جاري جلب قائمة الأعضاء...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>

        </main>

    </div>

    <!-- التوست للإشعارات السريعة -->
    <div class="toast-container"></div>

    <script type="module" src="js/auth-guard.js"></script>
    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
